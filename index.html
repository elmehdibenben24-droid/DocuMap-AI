<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakanAI - Smart Docs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        html, body { height: 100%; }
        body { height: 100dvh; }
        @supports not (height: 100dvh) {
            body { height: -webkit-fill-available; }
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col md:flex-row">

    <aside class="w-full md:w-1/3 bg-white border-l border-gray-200 flex-col hidden md:flex">
        <div class="p-6 border-b border-gray-200 bg-blue-600 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold" data-i18n="docTitle"><i class="fa-solid fa-book-open mx-2"></i> دليل الاستعمال</h1>
                <p class="text-sm text-blue-100 mt-1" data-i18n="docSub">الوثائق والأسئلة المتكررة</p>
            </div>
            <select id="lang-switch" class="bg-blue-700 text-white text-sm rounded border-none p-1 outline-none">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
        </div>
        <div class="p-4 flex-1 overflow-y-auto">
            <div class="relative mb-6">
                <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="ابحث في الوثائق..." class="w-full px-10 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
            
            <!-- أضفنا بعض المحتوى هنا باش تبان القائمة عامرة -->
            <div class="space-y-2 mt-4">
                <div class="p-3 bg-gray-50 rounded-lg border border-gray-100 cursor-pointer hover:bg-gray-100 transition">
                    <p class="text-sm font-medium text-gray-800"><i class="fa-solid fa-file-lines text-blue-500 ml-2"></i>كيفية الاستخدام</p>
                </div>
                 <div class="p-3 bg-gray-50 rounded-lg border border-gray-100 cursor-pointer hover:bg-gray-100 transition">
                    <p class="text-sm font-medium text-gray-800"><i class="fa-solid fa-shield-halved text-blue-500 ml-2"></i>سياسة الخصوصية</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-gray-50">
        <header class="bg-white p-4 border-b border-gray-200 flex items-center shadow-sm">
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 mx-3">
                <i class="fa-solid fa-robot text-xl"></i>
            </div>
            <div>
                <h2 class="font-bold text-gray-800" data-i18n="botName">المساعد الذكي</h2>
                <p class="text-xs text-green-500"><i class="fa-solid fa-circle text-[8px] mx-1"></i> <span data-i18n="online">متصل</span></p>
            </div>
        </header>

        <div id="chat-box" class="flex-1 p-6 overflow-y-auto flex flex-col space-y-4">
            <div class="flex items-start max-w-[80%]">
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white mx-2 flex-shrink-0">
                    <i class="fa-solid fa-robot text-sm"></i>
                </div>
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-800" id="welcome-msg">مرحباً! أنا المساعد الذكي. كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-200">
            <div class="flex items-center bg-gray-50 border border-gray-300 rounded-full px-4 py-2 focus-within:border-blue-500">
                <input id="user-input" type="text" data-i18n-placeholder="inputPlaceholder" placeholder="اسأل عن أي شيء..." class="flex-1 bg-transparent border-none focus:outline-none text-gray-800 text-sm px-2">
                <button id="send-btn" class="w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center transition disabled:opacity-50 flex-shrink-0">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        const i18n = {
            ar: { 
                docTitle: "دليل الاستعمال", 
                docSub: "الوثائق والأسئلة المتكررة", 
                searchPlaceholder: "ابحث في الوثائق...", 
                botName: "المساعد الذكي", 
                online: "متصل", 
                inputPlaceholder: "اسأل عن أي شيء...", 
                welcome: "مرحباً! أنا المساعد الذكي. كيف يمكنني مساعدتك اليوم؟", 
                errorMsg: "عذراً، وقع خطأ.",
                botReplyPrefix: "لقد قلت: "
            },
            fr: { 
                docTitle: "Guide d'utilisation", 
                docSub: "Documents et FAQ", 
                searchPlaceholder: "Rechercher...", 
                botName: "Assistant Intelligent", 
                online: "En ligne", 
                inputPlaceholder: "Posez votre question...", 
                welcome: "Bonjour ! Je suis l'assistant intelligent. Comment puis-je vous aider ?", 
                errorMsg: "Désolé, une erreur s'est produite.",
                botReplyPrefix: "Vous avez dit : "
            },
            en: { 
                docTitle: "User Guide", 
                docSub: "Docs & FAQ", 
                searchPlaceholder: "Search documents...", 
                botName: "Smart Assistant", 
                online: "Online", 
                inputPlaceholder: "Ask anything...", 
                welcome: "Hello! I am the smart assistant. How can I help you?", 
                errorMsg: "Sorry, an error occurred.",
                botReplyPrefix: "You said: "
            }
        };

        let currentLang = 'ar';

        document.getElementById('lang-switch').addEventListener('change', (e) => {
            currentLang = e.target.value;
            const dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('html-root').setAttribute('dir', dir);
            document.getElementById('html-root').setAttribute('lang', currentLang);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const icon = el.querySelector('i');
                // حفظ الأيقونة إذا كانت موجودة وإضافتها للنص الجديد
                let iconHTML = icon ? icon.outerHTML : '';
                el.innerHTML = i18n[currentLang][el.getAttribute('data-i18n')];
                
                // إعادة الأيقونة في المكان المناسب حسب اللغة (في العربية على اليمين، اللغات الأخرى على اليسار)
                if(iconHTML){
                   if(currentLang === 'ar'){
                       el.innerHTML = iconHTML + ' ' + el.innerHTML;
                   } else {
                       el.innerHTML = iconHTML + ' ' + el.innerHTML;
                   }
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = i18n[currentLang][el.getAttribute('data-i18n-placeholder')];
            });
            document.getElementById('welcome-msg').innerText = i18n[currentLang].welcome;
        });

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.innerText = str;
            return div.innerHTML;
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            
            // تعديل اتجاه الرسالة حسب من أرسلها
            if (sender === 'user') {
                // رسالة المستخدم (دائما على اليمين في العربية، واليسار في اللغات الأخرى)
                msgDiv.className = `flex items-start max-w-[80%] self-end flex-row-reverse`;
            } else {
                // رسالة الروبوت
                msgDiv.className = `flex items-start max-w-[80%] self-start`;
            }

            const icon = sender === 'user'
                ? `<div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-white mx-2 flex-shrink-0"><i class="fa-solid fa-user text-sm"></i></div>`
                : `<div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white mx-2 flex-shrink-0"><i class="fa-solid fa-robot text-sm"></i></div>`;

            const bubble = `<div class="${sender === 'user' ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border border-gray-100 shadow-sm'} p-3 rounded-2xl">
                                <p class="text-sm whitespace-pre-wrap">${escapeHTML(text)}</p>
                            </div>`;

            // ترتيب الأيقونة والفقاعة
            if (sender === 'user') {
                 msgDiv.innerHTML = icon + bubble;
            } else {
                 msgDiv.innerHTML = icon + bubble;
            }
           
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // هنا صلحنا المشكل! حيدنا الـ fetch ديال السيرفر وعوضناها بتفاعل بسيط
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            // محاكاة وقت التفكير ديال الذكاء الاصطناعي (1 ثانية)
            setTimeout(() => {
                const reply = i18n[currentLang].botReplyPrefix + '"' + text + '"' + "\\nكيفاش نقدر نزيد نعاونك؟";
                appendMessage(reply, 'bot');
                sendBtn.disabled = false;
                userInput.focus();
            }, 1000);
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
